name: Monitor JR collection

on:
  schedule:
    # Supabase collects at :00/:15/:30/:45. Monitor after completion.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check completed collection
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo '::error::CRON_SECRET is not configured'; exit 1; }
          for attempt in 1 2 3; do
            response=$(curl -sS -o /tmp/collection-health.json -w '%{http_code}' \
              --connect-timeout 10 --max-time 20 \
              -H "Authorization: Bearer $CRON_SECRET" \
              'https://unkyu-hokkaido.jp/api/cron/crawl') || response=000
            if [ "$response" = 200 ]; then
              echo 'Collector is healthy or currently running.'
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo '::error::Rail collection failed, stalled, or could not be verified. Inspect Supabase rail_collection_runs.'
          exit 1
